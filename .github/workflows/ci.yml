name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/religion_audio
      TTS_SERVICE_URL: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - name: Validate Coolify compose
        env:
          POSTGRES_PASSWORD: ci-db-password
          AUTH_SECRET: ci-auth-secret
        run: docker compose config

  tts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile app.py
